<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEDGER | Student Academic Portal</title><link rel="stylesheet" href="/css/style.css"></head><body><section class="login-page"><aside class="login-visual"><div class="brand">LEDGER</div><div class="visual-copy"><p class="eyebrow" style="color:#f2cbd9">YOUR ACADEMIC COMPANION</p><h1>Make every mark count.</h1><p>Manage subjects, attendance and academic progress in one clear place.</p></div><small>STUDENT ACADEMIC MANAGEMENT SYSTEM</small></aside><main class="login-wrap"><div class="login-card"><div id="loginBox"><p class="eyebrow">WELCOME BACK</p><h2>Sign in to Ledger</h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><p id="loginError" class="error hidden"></p><button class="btn full">Sign In</button></form><p class="switch">New to Ledger? <button class="link-btn" id="showSignup">Create account</button></p></div><div id="signupBox" class="hidden"><p class="eyebrow">GET STARTED</p><h2>Create your account</h2><form id="signupForm"><div class="field"><label>Full name</label><input id="name" required minlength="2"></div><div class="field"><label>College email</label><input id="newEmail" type="email" required></div><div class="field"><label>Student ID</label><input id="studentId" required></div><div class="field"><label>Password (min 6 characters)</label><input id="newPassword" type="password" minlength="6" required></div><p id="signupError" class="error hidden"></p><button class="btn full">Create Account</button></form><p class="switch">Already registered? <button class="link-btn" id="showLogin">Sign in</button></p></div></div></main></section><script type="module" src="/js/auth.js"></script></body></html>
